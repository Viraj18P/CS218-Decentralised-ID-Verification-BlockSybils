[profile.default]
src      = "src"
test     = "test"
out      = "out"
libs     = ["lib"]
solc     = "0.8.24"

# contracts/ is compiled on-demand when imported by test files.
# No separate source root needed — Forge resolves imports transitively.

[profile.default.fmt]
line_length    = 120
tab_width      = 4
bracket_spacing = true
